name: Smoke de navegador

# F6.3 del plan de la familia Libra (2026-09-06), replicado desde el piloto de
# Contalibra: el unico test que ve lo que ve el humano. Levanta la app real
# --PostgreSQL del CI (postgres:16, la misma imagen que la suite), las migraciones
# que declara scripts/panel_admin.py, uvicorn sirviendo la SPA construida-- y un
# Chromium entra por /login con el admin, atraviesa el gate de Terminos como un
# cliente nuevo y espera la primera pantalla. Medido en el piloto: ~1:30 por
# corrida. No es un check requerido por la proteccion de rama.
#
# Desde 2026-10-12 el armado vive en la Action compartida `e2e-ci` de libra-web-kit (la misma que usa
# `e2e.yml`, los tests de dominio): este archivo sólo dice qué instancia levantar y qué proyecto de Playwright correr (`smoke`).

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # -- Dependencias privadas: la misma receta que los jobs test y frontend --
      - name: Acceso SSH a los motores y a libra-ui
        env:
          LIBRACORE_DEPLOY_KEY: ${{ secrets.LIBRACORE_DEPLOY_KEY }}
          LIBRACOMMERCE_DEPLOY_KEY: ${{ secrets.LIBRACOMMERCE_DEPLOY_KEY }}
          LIBRAAUTH_DEPLOY_KEY: ${{ secrets.LIBRAAUTH_DEPLOY_KEY }}
          LIBRA_UI_DEPLOY_KEY: ${{ secrets.LIBRA_UI_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          configurar() {
            repo=$1; clave=$2
            if [ -z "$clave" ]; then echo "::error::Falta el secret con la deploy key de $repo."; exit 1; fi
            printf '%s\n' "$clave" > ~/.ssh/id_"$repo"; chmod 600 ~/.ssh/id_"$repo"
            printf 'Host github-%s\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/id_%s\n  IdentitiesOnly yes\n' "$repo" "$repo" >> ~/.ssh/config
            git config --global url."git@github-$repo:marianocappucci/$repo".insteadOf "https://github.com/marianocappucci/$repo"
            saludo=$(ssh -o StrictHostKeyChecking=yes -T "git@github-$repo" 2>&1 || true)
            case "$saludo" in *"marianocappucci/$repo"*) echo "$repo OK" ;; *) echo "::error::La deploy key de $repo no resuelve a marianocappucci/$repo: $saludo"; exit 1 ;; esac
          }
          configurar libracore "$LIBRACORE_DEPLOY_KEY"
          configurar libracommerce "$LIBRACOMMERCE_DEPLOY_KEY"
          configurar libraauth "$LIBRAAUTH_DEPLOY_KEY"
          configurar libra-ui "$LIBRA_UI_DEPLOY_KEY"

      # PostgreSQL (espejo de ECR), backend desde el lock, SPA, migraciones de scripts/panel_admin.py, uvicorn, Chromium y
      # Playwright. Una instancia recién nacida: sin semilla y con los Términos pendientes, que es lo que el smoke atraviesa.
      - name: Login y primera pantalla en Chromium
        uses: marianocappucci/libra-web-kit/.github/actions/e2e-ci@e2e-ci-v1
        with:
          variante: debian
          base: ventalibra
          usuario: ventalibra
          clave: ventalibra-ci
          proyecto: smoke
          env: |
            ENV=development
            DATA_DIR=${{ github.workspace }}/smoke-data
            VENTALIBRA_DATABASE_URL=postgresql+psycopg://ventalibra:ventalibra-ci@localhost:5432/ventalibra
            VENTALIBRA_LIBRACORE_DATABASE_URL=postgresql+psycopg://ventalibra:ventalibra-ci@localhost:5432/ventalibra
            SECRET_KEY=smoke-de-navegador-no-es-un-secreto-real-0123456789
            DOCS_AUTH_SECRET=smoke-docs
            ADMIN_USER=admin
            ADMIN_PASSWORD=smoke-admin-1234
            ADMIN_NOMBRE=Administrador
            VENTALIBRA_ADMIN_USERNAME=admin
            VENTALIBRA_ADMIN_PASSWORD=smoke-admin-1234
            SMOKE_USER=admin
            SMOKE_PASSWORD=smoke-admin-1234
          artefactos: smoke-playwright
