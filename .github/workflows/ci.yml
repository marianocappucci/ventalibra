name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # libracommerce y libracore son repos privados, inalcanzables con el
      # GITHUB_TOKEN por defecto (scopeado solo a este repo). LIBRA_PAT es
      # un PAT fine-grained con acceso de lectura a esos repos -- mismo
      # secreto que usan gestiolibra/medlibra. Pendiente: dar de alta este
      # secreto en este repo nuevo (y confirmar que su alcance incluye
      # libracommerce, no solo libragenda/libracore).
      - name: Configure git for private Libra dependencies
        run: git config --global url."https://${{ secrets.LIBRA_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v
