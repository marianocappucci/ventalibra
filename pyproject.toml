[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ventalibra"
version = "0.1.0.dev0"
description = "Vertical de despensas, autoservicios y comercios minoristas de la familia Libra."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # v0.4.0 -> v0.5.0 (2026-08-05): el log de actividad. Salio de construir el
    # de ESTE producto — es el unico de la familia sin SQLAlchemy en el
    # dominio, asi que no le servia el mecanismo de libraauth (cuelga del
    # flush) ni el de libracore (consulta el schema en castellano). El enganche
    # es el repositorio envuelto; ver app/commerce.py.
    "libracommerce @ git+https://github.com/marianocappucci/libracommerce.git@v0.6.0",
    # libracore sigue proveyendo facturacion/caja/ARCA -- y la base donde vive
    # `usuarios`. El auth SALIO de aca el 2026-07-30 y ahora lo da libraauth.
    #
    # v1.6.0 -> v1.8.0 (2026-08-04). De las dos versiones, a este producto le
    # importa la primera: usa `ticket_generator.generar_ticket_venta`, y
    # v1.7.0 arreglo que un caracter fuera de latin-1 -un guion largo, unas
    # comillas curvas- tumbara la generacion con un 500. La maqueta compacta de
    # v1.8.0 aplica a los comprobantes A4, que este producto no emite por ahora
    # (no usa `pdf_generator`, verificado). Cuando sume facturacion, la va a
    # tener ya puesta.
    #
    # v1.8.2 -> v1.9.0 (2026-08-05): los recibos. Este producto SI los usa —
    # `libracore.recibos` para el comprobante de la cobranza de cuenta
    # corriente, y con eso empieza a usar `pdf_generator` (el recibo es A4).
    "libracore @ git+https://github.com/marianocappucci/libracore.git@v1.28.1",
    # v0.7.0 -> v0.12.0 (2026-08-05). De aca sale la mitad de accesos del log
    # (v0.8.0 `auth_events`), el router que lee las dos mitades (v0.10.0) y el
    # middleware que sella el usuario de la request. La actividad en si NO sale
    # de aca: el mecanismo de v0.9.0 cuelga del flush de SQLAlchemy y este
    # producto no lo tiene -- la da libracommerce v0.5.0.
    "libraauth @ git+https://github.com/marianocappucci/libraauth.git@v0.23.0",
    # SQLAlchemy entra SOLO para el engine de `usuarios` de libraauth: el resto
    # de VentaLibra es sqlite3 crudo (app/db.py). El engine va contra la base de
    # libracore, no contra la del dominio -- ver create_app() en app/main.py.
    "sqlalchemy>=2.0",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=6",
    "ruff>=0.13",
    "httpx>=0.27,<1",
    "pytest>=8.0",
    # Para leer el texto de los recibos. Un test que solo comprueba que salgan
    # bytes pasa aunque el comprobante salga en blanco.
    "pypdf>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true

# === lint + coverage (agregado 2026-07-31) ===
# Lint activado en los 12 repos de la familia el mismo dia. El ruleset es
# CURADO, no el default de ruff: el default tiraba entre 132 y 224 hallazgos
# por repo, casi todo estilo, y un lint que arranca en rojo se ignora desde el
# primer dia. Estas reglas dan CERO hallazgos hoy en los 12, asi que cualquier
# rojo futuro es una regresion real y no deuda vieja.
#
# F401 (import sin usar) queda AFUERA A PROPOSITO: son ~396 en la familia y
# buena parte son re-exports deliberados en __init__.py, donde el import ES la
# API publica del modulo. Sacarlos a ciegas rompe a quien importa desde ahi.
# Queda como backlog aparte, para revisar a mano archivo por archivo.
[tool.ruff]
line-length = 120
extend-exclude = ["frontend", "website", "node_modules"]

[tool.ruff.lint]
select = [
    "E9",    # el archivo no parsea, o error de IO al leerlo
    "F63",   # comparaciones invalidas (`is` contra un literal, `in` mal usado)
    "F7",    # `break` / `continue` / `return` fuera de lugar
    "F811",  # redefinicion de un nombre ya definido o importado
    "F821",  # nombre no definido -> NameError seguro en runtime
    "F822",  # nombre listado en __all__ que no existe en el modulo
    "F823",  # variable local usada antes de asignarse
    "F841",  # variable asignada y nunca usada (codigo muerto)
    "F541",  # f-string sin placeholders (suele ser llaves olvidadas)
    "F502", "F506", "F522", "F524",  # %/format() con argumentos mal armados
    "F601", "F602",                  # `x in 1, 2` en vez de `x in (1, 2)`
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/tests/*", "*/migrations/*", "*/.venv/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Piso de cobertura. Es un TRINQUETE, no una meta: se fijo 2 puntos por
# debajo de lo que el repo media el 2026-07-31 (92%), asi que hoy pasa
# holgado y lo unico que puede ponerlo en rojo es una regresion. Cuando la
# cobertura suba de verdad, subir tambien este numero -- nunca bajarlo para
# que pase un cambio.
fail_under = 90
