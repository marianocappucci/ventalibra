[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ventalibra"
version = "0.1.0.dev0"
description = "Vertical de despensas, autoservicios y comercios minoristas de la familia Libra."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "libracommerce @ git+https://github.com/marianocappucci/libracommerce.git@v0.3.0",
    "libracore @ git+https://github.com/marianocappucci/libracore.git@v0.27.0",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true
