[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ventalibra"
version = "0.1.0.dev0"
description = "Vertical de despensas, autoservicios y comercios minoristas de la familia Libra."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # v0.4.0 -> v0.5.0 (2026-08-05): el log de actividad. Salio de construir el
    # de ESTE producto — es el unico de la familia sin SQLAlchemy en el
    # dominio, asi que no le servia el mecanismo de libraauth (cuelga del
    # flush) ni el de libracore (consulta el schema en castellano). El enganche
    # es el repositorio envuelto; ver app/commerce.py.
    # v0.7.0-v0.7.2 suben al motor las transferencias entre depositos, la guarda
    # de disponibilidad y los presets de variante por rubro. **Este producto no
    # tenia transferencias y sigue sin tenerlas**: no hay nada que reemplazar
    # aca --a diferencia de Contalibra y Restolibra, que tenian su propia
    # implementacion-- asi que esto es alinear la version, no adoptar una
    # funcion. `transfer_stock` queda disponible el dia que se le construya el
    # endpoint y la pantalla.
