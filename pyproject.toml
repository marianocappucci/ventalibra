[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ventalibra"
version = "0.1.0.dev0"
description = "Vertical de despensas, autoservicios y comercios minoristas de la familia Libra."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # v0.4.0 -> v0.5.0 (2026-08-05): el log de actividad. Salio de construir el
    # de ESTE producto — es el unico de la familia sin SQLAlchemy en el
    # dominio, asi que no le servia el mecanismo de libraauth (cuelga del
    # flush) ni el de libracore (consulta el schema en castellano). El enganche
    # es el repositorio envuelto; ver app/commerce.py.
    # v0.7.0-v0.7.2 suben al motor las transferencias entre depositos, la guarda
    # de disponibilidad y los presets de variante por rubro. **Este producto no
    # tenia transferencias y sigue sin tenerlas**: no hay nada que reemplazar
    # aca --a diferencia de Contalibra y Restolibra, que tenian su propia
    # implementacion-- asi que esto es alinear la version, no adoptar una
    # funcion. `transfer_stock` queda disponible el dia que se le construya el
    # endpoint y la pantalla.
    "libracommerce @ git+https://github.com/marianocappucci/libracommerce.git@v0.9.1",
    # libracore sigue proveyendo facturacion/caja/ARCA -- y la base donde vive
    # `usuarios`. El auth SALIO de aca el 2026-07-30 y ahora lo da libraauth.
    #
    # v1.6.0 -> v1.8.0 (2026-08-04). De las dos versiones, a este producto le
    # importa la primera: usa `ticket_generator.generar_ticket_venta`, y
    # v1.7.0 arreglo que un caracter fuera de latin-1 -un guion largo, unas
    # comillas curvas- tumbara la generacion con un 500. La maqueta compacta de
    # v1.8.0 aplica a los comprobantes A4, que este producto no emite por ahora
    # (no usa `pdf_generator`, verificado). Cuando sume facturacion, la va a
    # tener ya puesta.
    #
    # v1.8.2 -> v1.9.0 (2026-08-05): los recibos. Este producto SI los usa —
    # `libracore.recibos` para el comprobante de la cobranza de cuenta
    # corriente, y con eso empieza a usar `pdf_generator` (el recibo es A4).
    #
    # v1.29.0 -> v1.30.0 (2026-08-12): el PDF de un comprobante se fecha con el
    # comprobante y no con el reloj, asi que reimprimirlo da el mismo archivo.
    # Aplica al ticket (`/sales/{id}/ticket`) y al recibo de la cobranza.
    #
    # v1.33.0 -> v1.37.0 (2026-08-14): los PDF no se salen del marco del papel.
    # Este producto SI consume `pdf_generator` (ademas de `recibos` y
    # `ticket_generator`), asi que el arreglo le llega de verdad:
    #
    # - `_wrap_text` parte por caracter la palabra que no entra en el renglon.
    #   Un texto sin espacios --un codigo de orden de compra, una URL, un
    #   serial pegado-- volvia entero y `cell` lo dibujaba: medido, 435 mm de
    #   borde derecho en una hoja de 210, en remito, presupuesto, factura y
    #   resumen de cuenta corriente.
    # - La condicion de venta y las filas del detalle de cobros del recibo se
    #   recortan con elipsis dentro de su celda: esos dos desbordaban **con
    #   datos normales**, sin caso extremo.
    #
    # El ticket termico (`ticket_generator`) NO entra: son 80 mm de papel con
    # margenes propios de 2 mm, otra geometria.
    #
    # Los cinco comprobantes salen byte por byte identicos a como salian
    # (sha256 comparado con datos reales).
    #
    # v1.37.0 -> v1.38.0 (2026-08-14): las filas meta del membrete tambien se
    # recortan. La caja del valor mide ~31 mm --unos 25 caracteres a 7 pt-- y
    # `cell` no recorta: lo que se pasa se dibujaba afuera del papel. El unico
    # documento que mete texto libre ahi es el RECIBO, que pone el concepto en
    # ("Comprobante:", ref_line). Medido en la demo de VentaLibra: "Pago a
    # cuenta en cuenta corriente" terminaba en 202,2 mm en una hoja de 210.
    #
    # Es anterior a v1.37.0 y aquel arreglo no lo cubria.
    #
    # 🔴 **El cobro con QR necesita v1.40.0 o mas.** Hasta la v1.39.2
    # `crear_orden_qr` pegaba a
    # `/instore/qrs/merchant/stores/default/pos/{pos_id}/orders`, que NO existe
    # --- contra una cuenta real da 404 --- y la linea siguiente hacia
    # `r.json()` sobre una respuesta 204 sin cuerpo, asi que arreglar solo la
    # URL habria cambiado un error por otro. Las dos cosas se arreglaron en la
    # v1.40.0, verificadas contra la cuenta real de Contalibra.
    #
    # El pin ya estaba en v1.45.0 cuando entro el cobro con QR (lo subio el
    # arreglo de la zona horaria de la plantilla de provisioning), asi que esta
    # nota no pide subir nada: **fija el piso**. Si alguna vez alguien baja este
    # pin por debajo de v1.40.0, el cobro con QR se rompe sin que nada avise ---
    # `services/mp_qr.py` no puede detectarlo, porque la URL mal armada la
    # responde MercadoPago con un 404 igual que un POS ID inexistente.
    #
    # 🔴 **Y desde el 2026-08-25 hay un segundo piso: v1.52.0.** Es la version
    # donde `mercado_pago` --la grafia vieja de este POS-- salio de
    # `medios_pago.HISTORICOS` y de `MEDIOS_ELECTRONICOS`, despues de migrar las
    # filas que la tenian. Con un pin anterior el producto vuelve a etiquetar y
    # a aceptar por QR una grafia que sus datos ya no tienen: no falla, y por
    # eso hay un test que lo agarra --- `test_el_motor_pineado_ya_no_conoce_la_
    # grafia_vieja`, que pregunta por el COMPORTAMIENTO del modulo instalado y
    # no por este string.
    # 🔴 El extra `[migrations]` **hace falta desde el 2026-08-25**: trae alembic,
    # que este producto NO tenía en su contenedor (medido) y que
    # `libracore-migrar` necesita para aplicar la cadena del motor. Sin él, el
    # paso del deploy muere con un `ModuleNotFoundError` en vez de correr.
    "libracore[migrations] @ git+https://github.com/marianocappucci/libracore.git@v1.63.0",
    # v0.7.0 -> v0.12.0 (2026-08-05). De aca sale la mitad de accesos del log
    # (v0.8.0 `auth_events`), el router que lee las dos mitades (v0.10.0) y el
    # middleware que sella el usuario de la request. La actividad en si NO sale
    # de aca: el mecanismo de v0.9.0 cuelga del flush de SQLAlchemy y este
    # producto no lo tiene -- la da libracommerce v0.5.0.
    "libraauth @ git+https://github.com/marianocappucci/libraauth.git@v0.34.0",
    # SQLAlchemy entra SOLO para el engine de `usuarios` de libraauth: el resto
    # de VentaLibra es sqlite3 crudo (app/db.py). El engine va contra la base de
    # libracore, no contra la del dominio -- ver create_app() en app/main.py.
    "sqlalchemy>=2.0",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=6",
    "ruff>=0.13",
    "httpx>=0.27,<1",
    "pytest>=8.0",
    # Para leer el texto de los recibos. Un test que solo comprueba que salgan
    # bytes pasa aunque el comprobante salga en blanco.
    "pypdf>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
markers = [
    "sin_aceptar_terminos: deja al test afuera de la excepcion autouse del conftest, para medir el gate de Terminos con el corte puesto de verdad",
]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true

# === lint + coverage (agregado 2026-07-31) ===
# Lint activado en los 12 repos de la familia el mismo dia. El ruleset es
# CURADO, no el default de ruff: el default tiraba entre 132 y 224 hallazgos
# por repo, casi todo estilo, y un lint que arranca en rojo se ignora desde el
# primer dia. Estas reglas dan CERO hallazgos hoy en los 12, asi que cualquier
# rojo futuro es una regresion real y no deuda vieja.
#
# F401 (import sin usar) queda AFUERA A PROPOSITO: son ~396 en la familia y
# buena parte son re-exports deliberados en __init__.py, donde el import ES la
# API publica del modulo. Sacarlos a ciegas rompe a quien importa desde ahi.
# Queda como backlog aparte, para revisar a mano archivo por archivo.
[tool.ruff]
line-length = 120
extend-exclude = ["frontend", "website", "node_modules"]

[tool.ruff.lint]
select = [
    "E9",    # el archivo no parsea, o error de IO al leerlo
    "F63",   # comparaciones invalidas (`is` contra un literal, `in` mal usado)
    "F7",    # `break` / `continue` / `return` fuera de lugar
    "F811",  # redefinicion de un nombre ya definido o importado
    "F821",  # nombre no definido -> NameError seguro en runtime
    "F822",  # nombre listado en __all__ que no existe en el modulo
    "F823",  # variable local usada antes de asignarse
    "F841",  # variable asignada y nunca usada (codigo muerto)
    "F541",  # f-string sin placeholders (suele ser llaves olvidadas)
    "F502", "F506", "F522", "F524",  # %/format() con argumentos mal armados
    "F601", "F602",                  # `x in 1, 2` en vez de `x in (1, 2)`
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/tests/*", "*/migrations/*", "*/.venv/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Piso de cobertura. Es un TRINQUETE, no una meta: se fijo 2 puntos por
# debajo de lo que el repo media el 2026-07-31 (92%), asi que hoy pasa
# holgado y lo unico que puede ponerlo en rojo es una regresion. Cuando la
# cobertura suba de verdad, subir tambien este numero -- nunca bajarlo para
# que pase un cambio.
fail_under = 90
