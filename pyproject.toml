[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ventalibra"
version = "0.1.0.dev0"
description = "Vertical de despensas, autoservicios y comercios minoristas de la familia Libra."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "libracommerce @ git+https://github.com/marianocappucci/libracommerce.git@v0.4.0",
    # libracore sigue proveyendo facturacion/caja/ARCA -- y la base donde vive
    # `usuarios`. El auth SALIO de aca el 2026-07-30 y ahora lo da libraauth.
    "libracore @ git+https://github.com/marianocappucci/libracore.git@v1.2.0",
    "libraauth @ git+https://github.com/marianocappucci/libraauth.git@v0.5.0",
    # SQLAlchemy entra SOLO para el engine de `usuarios` de libraauth: el resto
    # de VentaLibra es sqlite3 crudo (app/db.py). El engine va contra la base de
    # libracore, no contra la del dominio -- ver create_app() en app/main.py.
    "sqlalchemy>=2.0",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true
