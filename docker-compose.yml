services:
  # El backend de la instancia de dev desde el corte a PostgreSQL. Mismo patrón
  # que `libradesk-postgres`, con dos diferencias deliberadas:
  #
  # 🔴 La clave del servicio es `ventalibra-postgres` y no `db` ni `postgres`
  # A PROPÓSITO. `stack-net` es una red COMPARTIDA por todos los productos del
  # VPS, y Compose convierte la clave del servicio en un alias de red: dos
  # composes con la misma clave se turnan por round-robin del DNS interno. Ya
  # pasó en esta familia — `sistema.contalibra.com.ar` alternó entre el sistema
  # de un cliente y el auto-login de una demo.
  #
  # 🔴 Imagen Debian (`postgres:16`) y no la alpine, para que coincida con la
  # del CI: el collation viene de la imagen, y la alpine ordena por bytes —
  # como SQLite — mientras la Debian usa las reglas del locale. Un ORDER BY
  # sobre texto no da lo mismo en las dos.
  #
  # Sin `ports:` a propósito: sólo se llega desde la red interna. Publicar 5432
  # en un VPS es publicarla a Internet.
  ventalibra-postgres:
    image: postgres:16
    command: postgres -c timezone=America/Argentina/Buenos_Aires
    container_name: ventalibra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ventalibra
      POSTGRES_USER: ventalibra
      # Sin default a propósito: `:?` aborta el `up` si falta, en vez de
      # levantar la base con una clave escrita en git. Se define en el `.env`
      # del VPS, que no se versiona.
      POSTGRES_PASSWORD: ${VENTALIBRA_POSTGRES_PASSWORD:?hay que definirla en el .env del VPS}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - ventalibra-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ventalibra -d ventalibra"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - datos

  ventalibra-dev:
    build:
      context: .
      # Un id SSH por paquete privado, igual que los
      # `--mount=type=ssh,id=...` del Dockerfile y que
      # `libracore.provisioning.docker_build_ssh_args()` para el build de
      # producción: GitHub autentica toda la conexión con la primera deploy
      # key que le ofrecen, así que una sola key no alcanza.
      #
      # Declarar sólo `default` (como estaba hasta el 2026-07-28) hacía
      # fallar `docker compose build` al clonar libracommerce/libra-ui, así
      # que la imagen de dev no se podía reconstruir y quedó congelada
      # mientras el bind mount `./:/app` seguía trayendo código nuevo —
      # hasta que ese código importó un símbolo que la imagen vieja no
      # tenía y uvicorn dejó de levantar el worker.
      ssh:
        - default=${LIBRACORE_SSH_KEY:-~/.ssh/id_ed25519_libracore}
        - libracore=${LIBRACORE_SSH_KEY:-~/.ssh/id_ed25519_libracore}
        - libracommerce=${LIBRACOMMERCE_SSH_KEY:-~/.ssh/id_ed25519_libracommerce}
        - libraauth=${LIBRAAUTH_SSH_KEY:-~/.ssh/id_ed25519_libraauth}
        - libra-ui=${LIBRA_UI_SSH_KEY:-~/.ssh/id_ed25519_libra_ui}
    container_name: ventalibra-dev
    depends_on:
      ventalibra-postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.0
    healthcheck:
      # 🔴 El chequeo mira el CUERPO, no el codigo HTTP. Este backend sirve la SPA
      # con un catch-all, asi que **cualquier** ruta devuelve 200 mientras uvicorn
      # sirva estaticos: un `urlopen()` a secas da healthy con la API muerta, y da
      # healthy tambien apuntado a una ruta inventada. Medido el 2026-08-12 por
      # `docker exec` en los 21 contenedores del VPS: los 21 daban exit 0 contra una
      # ruta que no existe. Un chequeo que no puede fallar no es un chequeo.
      #
      # `json.load` sobre el index.html revienta, que es exactamente lo que se busca.
      # `isinstance(..., dict)` y no una clave concreta porque el cuerpo difiere
      # entre productos; es ademas lo que emite el generador de instancias de
      # LibraCore (PR #82), asi que dev y las instancias no divergen.
      test: ["CMD", "python3", "-c", "import json,urllib.request; assert isinstance(json.load(urllib.request.urlopen('http://localhost:8000/health', timeout=3)), dict)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "8081:8000"
    volumes:
      - ./:/app
    # 🔴 Las migraciones también acá, no sólo en el deploy.
    # `cmd_actualizar` las corre para las instancias de cliente y la demo,
    # pero ESTA la levanta el compose del repo y el motor no la toca. Tiene
    # que decir LO MISMO que `migraciones` en los dos scripts de `scripts/`;
    # hay un test que ata las dos puntas.
    #
    # `exec` para que uvicorn quede como PID 1 y `docker stop` le llegue.
    command: sh -c "libracore-migrar upgrade --prefijo ventalibra && alembic upgrade head && exec uvicorn app.asgi:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      - SECRET_KEY=${SECRET_KEY:-ventalibra-dev-secret}
      - TZ=America/Argentina/Buenos_Aires
      - VENTALIBRA_ADMIN_USERNAME=${VENTALIBRA_ADMIN_USERNAME:-admin}
      - VENTALIBRA_ADMIN_PASSWORD=${VENTALIBRA_ADMIN_PASSWORD:-}
      # 🔴 El corte a PostgreSQL. Las dos variables apuntan al MISMO schema:
      # las tablas del dominio y las de LibraCore conviven ahí, que es lo que
      # ya hacían las dos bases SQLite de `dev-data/`.
      #
      # ⚠️ **Acá había una receta de rollback y ya no funciona.** Decía que
      # volver estas dos líneas a las rutas `.db` de `dev-data/` y reiniciar era
      # el rollback completo. Desde el 2026-08-25 `app/services/billing.py`
      # rechaza cualquier destino que no sea una URL de PostgreSQL, así que
      # seguir esa receta hoy **no arranca**: muere con un mensaje que dice qué
      # variable definir.
      #
      # No es un descuido, es la decisión: el rollback a SQLite dejó de aplicar
      # ese mismo día —el corte tiene meses y hay backups verificados de las dos
      # bases—. Se saca la receta en vez de dejarla porque una instrucción que
      # ya no anda cuesta más que ninguna: el que la siga va a creer que rompió
      # algo.
      #
      # Si alguna vez hiciera falta mirar aquellos datos, el camino es
      # `python -m libracore.db.schema_dump` sobre el archivo, que lo abre en
      # modo lectura sin tocarlo.
      - VENTALIBRA_DB_PATH=postgresql://ventalibra:${VENTALIBRA_POSTGRES_PASSWORD:?hay que definirla en el .env del VPS}@ventalibra-postgres:5432/ventalibra
      - VENTALIBRA_LIBRACORE_DB_PATH=postgresql://ventalibra:${VENTALIBRA_POSTGRES_PASSWORD:?hay que definirla en el .env del VPS}@ventalibra-postgres:5432/ventalibra
      - ENV=development
      # Recuperacion de contrasena (libraauth v0.5.0). Sin SMTP la app
      # levanta igual y POST /auth/forgot-password devuelve 503: cargar
      # estas variables es lo unico que falta para que mande mails.
      - VENTALIBRA_RESET_URL_BASE=${VENTALIBRA_RESET_URL_BASE:-https://dev.ventalibra.com.ar/reset-password}
      - LIBRAAUTH_SMTP_HOST=${LIBRAAUTH_SMTP_HOST:-}
      - LIBRAAUTH_SMTP_PORT=${LIBRAAUTH_SMTP_PORT:-587}
      - LIBRAAUTH_SMTP_USER=${LIBRAAUTH_SMTP_USER:-}
      - LIBRAAUTH_SMTP_PASSWORD=${LIBRAAUTH_SMTP_PASSWORD:-}
      - LIBRAAUTH_SMTP_FROM_EMAIL=${LIBRAAUTH_SMTP_FROM_EMAIL:-}
      - LIBRAAUTH_SMTP_FROM_NAME=${LIBRAAUTH_SMTP_FROM_NAME:-VentaLibra}
      - DOCS_AUTH_SECRET=${DOCS_AUTH_SECRET:-}
    networks:
      - stack-net
      - datos

networks:
  datos:
    name: ventalibra-dev-datos
  stack-net:
    external: true
    name: stack_stack-net

volumes:
  ventalibra-postgres-data:
